name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Node engine dependencies
        working-directory: nimblegraph/node
        run: npm ci --no-audit --no-fund
      - name: Install
        run: pip install -e ".[dev]"
      - name: Test
        run: python -m pytest -q
